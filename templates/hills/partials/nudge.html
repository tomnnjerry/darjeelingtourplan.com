<aside class="nudge" data-nudge hidden aria-label="Planning help">
  <button type="button" class="nudge__x" data-nudge-close aria-label="Close">×</button>
  <p class="nudge__eyebrow">Reading up on {{ nudge_land|default:"the hills" }}?</p>
  <p class="nudge__title">We can turn this into a plan for your dates, at your budget</p>
  <a class="btn btn--sm" href="{% url 'plan' %}?from={{ request.path|urlencode }}{% if nudge_slug %}&land={{ nudge_slug }}{% endif %}" data-cta="nudge-plan">Get a free plan</a>
</aside>
